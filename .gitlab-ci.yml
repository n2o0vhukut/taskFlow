stages:
  - mirror

# すべてのブランチ/タグの履歴を取得してGitHubへミラーします。
# 必要なCI/CD変数（GitLabのSettings > CI/CD > Variablesで設定）
# - GITHUB_USER   : GitHubのユーザー名（例: yourname）
# - GITHUB_REPO   : リポジトリ名（例: taskflow）
# - GITHUB_TOKEN  : GitHubのPersonal Access Token（public_repo or repo）。Masked/Protected推奨。

variables:
  GIT_STRATEGY: fetch
  GIT_DEPTH: "0"  # 完全履歴

mirror_to_github:
  image: alpine:3.19
  stage: mirror
  rules:
    - if: $CI_COMMIT_BRANCH    # ブランチのpushで実行
    - if: $CI_COMMIT_TAG       # タグのpushで実行
  before_script:
    - apk add --no-cache git
    - git config --global user.name "gitlab-ci"
    - git config --global user.email "ci@example.com"
    - |
      if [ -z "$GITHUB_USER" ] || [ -z "$GITHUB_REPO" ] || [ -z "$GITHUB_TOKEN" ]; then
        echo "Set GITHUB_USER, GITHUB_REPO, GITHUB_TOKEN in CI/CD variables" >&2
        exit 1
      fi
    # すべてのブランチ/タグをローカルへ取得
    - git fetch --prune origin '+refs/heads/*:refs/heads/*' '+refs/tags/*:refs/tags/*'
    # GitHubリモートを追加（存在すればURL更新）
    - |
      URL="https://${GITHUB_USER}:${GITHUB_TOKEN}@github.com/${GITHUB_USER}/${GITHUB_REPO}.git"
      git remote add github "$URL" 2>/dev/null || git remote set-url github "$URL"
  script:
    # --mirror は削除も含めて完全同期します。安全に試す場合は --all と --tags を使ってください。
    - git push --mirror github
